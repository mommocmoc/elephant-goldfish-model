skill: "egm-creative-team"
description: "Behavioral evaluation scenario suite for egm-creative-team Dan Koe add-on skill."

scenarios:
  - scenario_id: "creative_team_mode_selection_gate"
    description: "Asserts single-select modal presentation for choosing the Dan Koe Creative Team mode."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-creative-team/SKILL.md"
    turns:
      - user_input: "I want to build my personal brand and content system using egm-creative-team."
        assertions:
          - type: "required_pattern"
            pattern: "Intellectual Signature Interview"
            message: "Mode gate must offer Intellectual Signature Interview."
          - type: "required_pattern"
            pattern: "Build-in-Public Worldview Bridge"
            message: "Mode gate must offer Build-in-Public Worldview Bridge."
          - type: "forbidden_pattern"
            pattern: "\\(Recommended\\)"
            message: "Mode gate must not contain (Recommended) prefix."
